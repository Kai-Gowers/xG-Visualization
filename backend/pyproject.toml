[project]
name = "xg-backend"
version = "3.0.0"
description = "Expected Goals model, data pipeline and API for the xG Visualization app"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.11",
    "pydantic-settings>=2.6",
    "xgboost>=3.0",
    "numpy>=2.0",
    "pyarrow>=19",
    "duckdb>=1.2",
    "orjson>=3.10",
]

[dependency-groups]
pipeline = [
    "httpx>=0.28",
    "pandas>=2.2,<3",
    "scikit-learn>=1.6",
    "optuna>=4.0",
    "matplotlib>=3.9",
    "tqdm>=4.66",
]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
    "ruff>=0.9",
]

[project.scripts]
xg-pipeline = "xg.pipeline.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["xg"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
